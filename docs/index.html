<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel NotifLogger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F7F5;
    --surface: #FFFFFF;
    --surface-2: #EEF3F0;
    --line: #DCE6E1;
    --ink: #14201B;
    --ink-muted: #5B6E65;
    --accent: #0E6B57;
    --accent-ink: #FFFFFF;
    --accent-soft: #E3F1EC;
    --good: #1E8E5A;
    --good-soft: #E4F5EB;
    --bad: #B3392C;
    --bad-soft: #FBEAE8;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(20,32,27,.06), 0 1px 1px rgba(20,32,27,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101613; --surface: #182420; --surface-2: #1E2C27; --line: #263B33;
      --ink: #E7EFEA; --ink-muted: #93A89D; --accent: #3FCBA3; --accent-ink: #08160F;
      --accent-soft: #16332A; --good: #49C98A; --good-soft: #143126; --bad: #E2776A; --bad-soft: #331B17;
      --shadow: 0 1px 3px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --paper: #101613; --surface: #182420; --surface-2: #1E2C27; --line: #263B33;
    --ink: #E7EFEA; --ink-muted: #93A89D; --accent: #3FCBA3; --accent-ink: #08160F;
    --accent-soft: #16332A; --good: #49C98A; --good-soft: #143126; --bad: #E2776A; --bad-soft: #331B17;
    --shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  :root[data-theme="light"] {
    --paper: #F4F7F5; --surface: #FFFFFF; --surface-2: #EEF3F0; --line: #DCE6E1;
    --ink: #14201B; --ink-muted: #5B6E65; --accent: #0E6B57; --accent-ink: #FFFFFF;
    --accent-soft: #E3F1EC; --good: #1E8E5A; --good-soft: #E4F5EB; --bad: #B3392C; --bad-soft: #FBEAE8;
    --shadow: 0 1px 2px rgba(20,32,27,.06), 0 1px 1px rgba(20,32,27,.04);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 120px; }

  header.top {
    display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between;
    gap: 12px; margin-bottom: 28px;
  }
  header.top h1 {
    font-family: "Sora", sans-serif; font-size: 26px; font-weight: 700; margin: 0;
    letter-spacing: -0.01em; text-wrap: balance;
  }
  header.top p { margin: 4px 0 0; color: var(--ink-muted); font-size: 13.5px; max-width: 52ch; }
  .summary-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 14px 7px 10px; font-size: 13px; font-weight: 500; color: var(--ink-muted);
    box-shadow: var(--shadow); white-space: nowrap;
  }
  .summary-chip strong {
    font-family: "IBM Plex Mono", monospace; color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .summary-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }

  .toast {
    padding: 11px 14px; border-radius: var(--radius); font-size: 13.5px; margin-bottom: 20px;
    animation: toast-in .15s ease-out;
  }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .toast.ok { background: var(--good-soft); color: var(--good); }
  .toast.err { background: var(--bad-soft); color: var(--bad); }

  section.panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 20px; overflow: hidden;
  }
  section.panel > .panel-head {
    padding: 15px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  section.panel > .panel-head h2 { font-family: "Sora", sans-serif; font-size: 15px; font-weight: 600; margin: 0; }
  section.panel > .panel-head span { font-size: 12.5px; color: var(--ink-muted); }
  section.panel > .panel-body { padding: 18px 20px; }

  .add-row { display: flex; gap: 8px; }
  .add-row input { flex: 1; }
  input[type=text] {
    font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); color: var(--ink);
  }
  input[type=text]::placeholder { color: var(--ink-muted); }
  input[type=text]:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  button {
    font: inherit; font-weight: 600; cursor: pointer; border: none; border-radius: 6px;
    padding: 9px 16px; background: var(--accent); color: var(--accent-ink);
  }

  .ledger { list-style: none; margin: 16px 0 0; padding: 0; border-top: 1px solid var(--line); }
  .ledger li {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .ledger .name { font-weight: 500; }
  .ledger .remove-btn {
    background: transparent; color: var(--bad); font-weight: 500; font-size: 12.5px; padding: 4px 8px;
  }
  .ledger .empty {
    color: var(--ink-muted); font-size: 13.5px; padding: 14px 0; text-align: center;
    border-bottom: 1px solid var(--line);
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin: 0; border: none; padding: 0; }
  .card {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .card-head { display: flex; align-items: center; gap: 10px; }
  .badge {
    width: 34px; height: 34px; border-radius: 8px; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-family: "Sora", sans-serif;
    font-weight: 700; font-size: 13px; flex: none;
  }
  .card-title { display: flex; flex-direction: column; flex: 1; min-width: 0; gap: 3px; }
  .card-title .name { font-family: "Sora", sans-serif; font-weight: 600; font-size: 15px; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: 999px; width: fit-content; letter-spacing: .02em;
  }
  .pill.connected { background: var(--good-soft); color: var(--good); }
  .pill.pending { background: var(--paper); color: var(--ink-muted); }

  label.field {
    display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 600;
    color: var(--ink-muted); text-transform: uppercase; letter-spacing: .04em;
  }
  select {
    font: 14px "IBM Plex Sans", system-ui, sans-serif; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--surface); color: var(--ink);
    text-transform: none; letter-spacing: normal; font-weight: 400;
  }

  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 14px 20px; box-shadow: 0 -2px 8px rgba(20,32,27,.08);
  }
  .actionbar .inner { max-width: 880px; margin: 0 auto; display: flex; justify-content: flex-end; }

  @media (max-width: 480px) {
    header.top { flex-direction: column; }
    .actionbar .inner { justify-content: stretch; }
    .actionbar button { width: 100%; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>Panel NotifLogger</h1>
        <p>Hubungkan tiap bank &amp; e-wallet ke Spreadsheet dan Sheet tujuan pencatatannya.</p>
      </div>
      <div class="summary-chip"><span class="summary-dot" id="summaryDot"></span><strong id="summaryCount">&mdash;/8</strong>&nbsp;terhubung</div>
    </header>

    <div id="notice"></div>

    <section class="panel">
      <div class="panel-head">
        <h2>Daftar Spreadsheet</h2>
        <span>Hanya Spreadsheet di sini yang muncul di dropdown</span>
      </div>
      <div class="panel-body">
        <div class="add-row">
          <input type="text" id="newSpreadsheetUrl" placeholder="Tempel link Google Sheet di sini">
          <button type="button" id="addSpreadsheetBtn">Tambah</button>
        </div>
        <ul class="ledger" id="allowedList"></ul>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Bank &amp; E-wallet</h2>
        <span>Pilih tujuan pencatatan tiap saluran</span>
      </div>
      <div class="panel-body">
        <form id="configForm" class="grid"></form>
      </div>
    </section>
  </div>

  <div class="actionbar"><div class="inner"><button type="submit" form="configForm" id="saveBtn">Simpan Semua</button></div></div>

<script>
// Ganti ke URL Web App Apps Script kamu kalau berbeda dari yang sudah ditanam di aplikasi Android.
var API_URL = "https://script.google.com/macros/s/AKfycbwmaD_puo3nZPzU5sfC84raKvut2bEkJSXviUO-PVyXY4g02fJ-7gBrRy2VFU6MOUN7mA/exec";

var CATEGORIES = [
  { key: "BCA", label: "BCA", short: "BC" },
  { key: "BRI", label: "BRI", short: "BR" },
  { key: "MANDIRI", label: "Mandiri", short: "MD" },
  { key: "BNI", label: "BNI", short: "BN" },
  { key: "DANA", label: "DANA", short: "DA" },
  { key: "OVO", label: "OVO", short: "OV" },
  { key: "LINKAJA", label: "LinkAja", short: "LA" },
  { key: "GOPAY", label: "GoPay", short: "GP" }
];

var spreadsheets = [];
var status = {};

function showNotice(message, isError) {
  document.getElementById("notice").innerHTML =
    '<div class="toast ' + (isError ? "err" : "ok") + '">' + message + "</div>";
}

function apiGet(query) {
  return fetch(API_URL + query).then(function (r) { return r.json(); });
}

function apiPost(payload) {
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload)
  }).then(function (r) { return r.json(); });
}

function updateSummary() {
  var connected = CATEGORIES.filter(function (c) { return status[c.key] && status[c.key].connected; }).length;
  document.getElementById("summaryCount").textContent = connected + "/" + CATEGORIES.length;
  document.getElementById("summaryDot").style.background = connected > 0 ? "var(--good)" : "var(--ink-muted)";
}

function renderAllowedList() {
  var ul = document.getElementById("allowedList");
  if (spreadsheets.length === 0) {
    ul.innerHTML = '<li class="empty">Belum ada Spreadsheet terdaftar &mdash; tambahkan link di atas.</li>';
    return;
  }
  ul.innerHTML = spreadsheets.map(function (s) {
    return '<li><span class="name">' + s.name + '</span>' +
      '<button type="button" class="remove-btn" data-id="' + s.id + '">Hapus</button></li>';
  }).join("");

  ul.querySelectorAll(".remove-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      apiPost({ action: "remove_spreadsheet", spreadsheetId: btn.getAttribute("data-id") })
        .then(function (res) {
          spreadsheets = res.spreadsheets || [];
          renderAllowedList();
          renderCategoryCards();
          showNotice(res.message, false);
        });
    });
  });
}

function spreadsheetOptionsHtml(selectedId) {
  var options = ['<option value="">Pilih Spreadsheet</option>'];
  spreadsheets.forEach(function (s) {
    options.push('<option value="' + s.id + '"' + (s.id === selectedId ? " selected" : "") + '>' + s.name + "</option>");
  });
  return options.join("");
}

function loadSheetsInto(selectEl, spreadsheetId, selectedSheet) {
  if (!spreadsheetId) {
    selectEl.innerHTML = '<option value="">Pilih Sheet</option>';
    return;
  }
  selectEl.innerHTML = '<option value="">Memuat&hellip;</option>';
  apiGet("?format=json&action=list_sheets&spreadsheetId=" + encodeURIComponent(spreadsheetId))
    .then(function (names) {
      var options = ['<option value="">Pilih Sheet</option>'];
      names.forEach(function (n) {
        options.push('<option value="' + n + '"' + (n === selectedSheet ? " selected" : "") + '>' + n + "</option>");
      });
      selectEl.innerHTML = options.join("");
    });
}

function renderCategoryCards() {
  var form = document.getElementById("configForm");
  form.innerHTML = CATEGORIES.map(function (c) {
    var current = status[c.key];
    var connected = current && current.connected;
    return '<div class="card">' +
      '<div class="card-head">' +
      '<div class="badge">' + c.short + '</div>' +
      '<div class="card-title"><span class="name">' + c.label + '</span>' +
      '<span class="pill ' + (connected ? "connected" : "pending") + '">' +
      (connected ? "Terhubung" : "Belum terhubung") + '</span></div>' +
      '</div>' +
      '<label class="field">Spreadsheet' +
      '<select class="ss-select" data-key="' + c.key + '">' + spreadsheetOptionsHtml("") + '</select>' +
      '</label>' +
      '<label class="field">Sheet / Tab' +
      '<select class="sheet-select" data-key="' + c.key + '"><option value="">Pilih Sheet</option></select>' +
      '</label>' +
      '</div>';
  }).join("");

  CATEGORIES.forEach(function (c) {
    var ssSelect = form.querySelector('.ss-select[data-key="' + c.key + '"]');
    var sheetSelect = form.querySelector('.sheet-select[data-key="' + c.key + '"]');
    var current = status[c.key];

    if (current && current.spreadsheetId) {
      ssSelect.value = current.spreadsheetId;
      loadSheetsInto(sheetSelect, current.spreadsheetId, current.sheetName);
    }

    ssSelect.addEventListener("change", function () {
      loadSheetsInto(sheetSelect, ssSelect.value, "");
    });
  });
}

document.getElementById("addSpreadsheetBtn").addEventListener("click", function () {
  var input = document.getElementById("newSpreadsheetUrl");
  var url = input.value.trim();
  if (!url) return;
  apiPost({ action: "add_spreadsheet", url: url }).then(function (res) {
    showNotice(res.message, res.status !== "ok");
    if (res.status === "ok") {
      spreadsheets = res.spreadsheets || [];
      input.value = "";
      renderAllowedList();
      renderCategoryCards();
    }
  });
});

document.getElementById("configForm").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var configs = {};
  document.querySelectorAll(".ss-select").forEach(function (sel) {
    var key = sel.getAttribute("data-key");
    var sheetSel = document.querySelector('.sheet-select[data-key="' + key + '"]');
    configs[key] = { spreadsheetId: sel.value, sheetName: sheetSel.value };
  });
  apiPost({ action: "save_config", configs: configs }).then(function (res) {
    showNotice(res.message, res.status !== "ok");
    if (res.status === "ok") {
      apiGet("?format=json").then(function (freshStatus) {
        status = freshStatus;
        updateSummary();
        renderCategoryCards();
      });
    }
  });
});

Promise.all([
  apiGet("?format=json&action=list_spreadsheets"),
  apiGet("?format=json")
]).then(function (results) {
  spreadsheets = results[0];
  status = results[1];
  updateSummary();
  renderAllowedList();
  renderCategoryCards();
}).catch(function () {
  showNotice("Gagal menghubungi backend. Cek koneksi internet, atau pastikan Apps Script sudah di-deploy dengan akses “Anyone”.", true);
});
</script>
</body>
</html>
