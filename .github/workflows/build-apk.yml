name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notiflogger-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Compute build number
        id: buildnum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh release list --repo ${{ github.repository }} --limit 1000 | wc -l)
          echo "number=$((count + 1))" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: android-app
        run: |
          gh release create "build-${{ steps.buildnum.outputs.number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Build #${{ steps.buildnum.outputs.number }}" \
            --notes "Build otomatis dari commit ${{ github.sha }}"
